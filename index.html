<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Kiểm thử số nguyên tố</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f1f5f4;
      color: #17211d;
    }

    main {
      width: min(820px, 100%);
      padding: 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 14px 40px #0002;
    }

    h1 {
      margin-top: 0;
    }

    form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      width: 100%;
      font-weight: bold;
    }

    input {
      flex: 1;
      min-width: 220px;
      padding: 12px;
      border: 1px solid #a7b3ad;
      border-radius: 10px;
      font: inherit;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #3ecf8e;
      color: #082518;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      margin-top: 20px;
    }

    #summary {
      margin: 8px 0 12px;
      font-weight: bold;
      white-space: pre-line;
    }

    #output {
      max-height: 420px;
      padding: 16px;
      overflow: auto;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #edf3f0;
      border-radius: 12px;
    }

    .warning {
      padding: 12px;
      margin: 16px 0;
      background: #fff4ce;
      color: #594400;
      border-radius: 10px;
    }

    .error {
      color: #b42318;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #101714;
        color: #edf5f1;
      }

      main {
        background: #19231f;
      }

      input,
      #output {
        color: white;
        background: #0f1713;
        border-color: #55625c;
      }

      .warning {
        background: #493e13;
        color: #ffe990;
      }

      .error {
        color: #ff8a80;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Kiểm thử số nguyên tố</h1>

    <p>
      Supabase sẽ đếm tất cả số nguyên tố nhỏ hơn
      số bạn nhập.
    </p>

    <div class="warning">
      Chương trình không có giới hạn trần do ứng dụng
      đặt ra. Giá trị quá lớn có thể khiến Edge Function
      bị ngắt do giới hạn CPU, RAM hoặc thời gian.
    </div>

    <form id="prime-form">
      <label for="limit">
        Nhập một số nguyên lớn hơn hoặc bằng 2
      </label>

      <input
        id="limit"
        type="number"
        min="2"
        step="1"
        value="100000000"
        required
      >

      <button id="submit" type="submit">
        Bắt đầu kiểm thử
      </button>
    </form>

    <div
      id="status"
      role="status"
      aria-live="polite"
    ></div>

    <div id="summary"></div>
    <div id="output" hidden></div>
  </main>

  <script>
    const FUNCTION_URL =
      "https://uqkjcvmqysetlljxzmen.supabase.co/functions/v1/automation-test";

    const form =
      document.querySelector("#prime-form");

    const input =
      document.querySelector("#limit");

    const button =
      document.querySelector("#submit");

    const statusBox =
      document.querySelector("#status");

    const summary =
      document.querySelector("#summary");

    const output =
      document.querySelector("#output");

    form.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        statusBox.className = "";
        summary.textContent = "";
        output.textContent = "";
        output.hidden = true;

        const limit = Number(input.value);

        if (
          !Number.isSafeInteger(limit) ||
          limit < 2
        ) {
          showError(
            "Hãy nhập một số nguyên an toàn lớn hơn hoặc bằng 2.",
          );

          return;
        }

        if (FUNCTION_URL.includes("PROJECT_ID")) {
          showError(
            "Bạn chưa thay PROJECT_ID bằng URL Supabase thật.",
          );

          return;
        }

        button.disabled = true;
        input.disabled = true;

        statusBox.textContent =
          "Đang tính toán. Không đóng trang này…";

        const requestStartedAt =
          performance.now();

        try {
          const response = await fetch(
            FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",
              },

              body: JSON.stringify({
                limit: limit,
              }),
            },
          );

          const responseText =
            await response.text();

          let data;

          try {
            data = JSON.parse(responseText);
          } catch {
            throw new Error(
              "Supabase không trả JSON. " +
              "Function có thể đã bị ngắt hoặc timeout.",
            );
          }

          if (!response.ok || !data.success) {
            throw new Error(
              data.error ||
              `HTTP ${response.status}`,
            );
          }

          const totalMs =
            performance.now() -
            requestStartedAt;

          statusBox.textContent =
            "Hoàn thành.";

          summary.textContent =
            `Giới hạn: ${
              data.limit.toLocaleString("vi-VN")
            }\n` +
            `Số lượng số nguyên tố: ${
              data.primeCount.toLocaleString("vi-VN")
            }\n` +
            `Thời gian tính trên Supabase: ${
              data.calculationSeconds
                .toLocaleString("vi-VN")
            } giây\n` +
            `Tổng thời gian yêu cầu: ${
              (totalMs / 1000).toFixed(3)
            } giây\n` +
            `Số đoạn đã xử lý: ${
              data.segmentsProcessed
                .toLocaleString("vi-VN")
            }`;

          output.textContent =
            "100 số nguyên tố đầu tiên:\n" +
            data.firstPrimes.join(", ") +
            "\n\n100 số nguyên tố cuối cùng:\n" +
            data.lastPrimes.join(", ");

          output.hidden = false;
        } catch (error) {
          const totalSeconds =
            (
              (
                performance.now() -
                requestStartedAt
              ) / 1000
            ).toFixed(3);

          showError(
            `Phép thử thất bại sau ` +
            `${totalSeconds} giây.\n` +
            `${
              error instanceof Error
                ? error.message
                : String(error)
            }`,
          );
        } finally {
          button.disabled = false;
          input.disabled = false;
        }
      },
    );

    function showError(message) {
      statusBox.className = "error";
      statusBox.textContent = message;
    }
  </script>
</body>
</html>
