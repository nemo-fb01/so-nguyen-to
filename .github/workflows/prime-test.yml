name: Prime number benchmark

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Tìm số nguyên tố nhỏ hơn số này"
        required: true
        default: "100000000"
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    concurrency:
      group: prime-number-benchmark
      cancel-in-progress: false

    steps:
      - name: Lấy source code
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Kiểm tra dữ liệu nhập
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          python - <<'PY'
          import os

          value = os.environ["LIMIT"]

          if not value.isdigit():
              raise SystemExit(
                  "Giới hạn phải là số nguyên dương."
              )

          if int(value) < 2:
              raise SystemExit(
                  "Giới hạn phải lớn hơn hoặc bằng 2."
              )

          print(f"Giới hạn hợp lệ: {int(value):,}")
          PY

      - name: Chạy phép thử
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          python prime_test.py --limit "$LIMIT"

      - name: Tạo phần tóm tắt
        if: always()
        run: |
          if [ -f prime-result.txt ]; then
            {
              echo "## Kết quả phép thử"
              echo
              echo '```text'
              cat prime-result.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lưu kết quả để tải xuống
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-number-result
          path: prime-result.txt
          if-no-files-found: ignore
          retention-days: 7
